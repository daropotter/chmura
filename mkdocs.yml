site_name: Chmura
site_description: An open-source private-cloud platform with a CLI-first workflow.
site_url: https://daropotter.github.io/chmura/
repo_url: https://github.com/daropotter/chmura
repo_name: daropotter/chmura
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Quickstart: getting-started/quickstart.md
      - First steps: getting-started/first-steps.md
      - Examples: getting-started/examples.md
  - Concepts:
      - Domain model: concepts/domain-model.md
  - CLI contract: cli.md
  - Networking & endpoints: networking.md
  - Deployment & rollout: deployment.md
  - Storage & volumes: storage.md
  - Observability: observability.md
  - Architecture: architecture.md
  - Local dev: local-dev.md
  - Reference:
      - chmura.yaml: reference/manifest.md
      - cluster.yaml: reference/cluster.md
      - installation.yaml: reference/installation.md
  - Design decisions: decisions.md
