site_name: Chmura
site_description: An open-source private-cloud platform with a CLI-first workflow.
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

nav:
  - Home: index.md
  - Concepts:
      - Domain model: concepts/domain-model.md
  - CLI contract: cli.md
  - Networking & endpoints: networking.md
  - Deployment & rollout: deployment.md
  - Observability: observability.md
  - Architecture: architecture.md
  - Local dev: local-dev.md
  - Reference:
      - Manifest: reference/manifest.md
  - Design decisions: decisions.md
