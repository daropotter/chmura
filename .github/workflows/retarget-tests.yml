name: retarget-stacked-prs tests

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/retarget.yml'
      - '.github/workflows/retarget-tests.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/retarget.yml'
      - '.github/workflows/retarget-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/*.test.cjs
